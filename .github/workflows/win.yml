name: Windows.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  windows:
    name: Windows Release x64
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        name: Native Tools Command Prompt.
        with:
          arch: x64

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Set up environment paths.
        shell: bash
        run: |
          echo "CACHE_KEY=$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          cd %TBUILD%
          echo "Building libraries and dependencies..."
          %REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent
          
          echo "Libraries build completed. Checking Qt installation..."
          if exist "%TBUILD%\Libraries\qt*" (
            echo Qt libraries found:
            dir /b "%TBUILD%\Libraries\qt*"
          ) else (
            echo WARNING: No Qt libraries found in %TBUILD%\Libraries\
            echo Available libraries:
            dir /b "%TBUILD%\Libraries\" 2>nul || echo No Libraries directory found
          )

      - name: Verify dependencies.
        run: |
          echo "Verifying build dependencies..."
          cd %TBUILD%
          
          echo "Checking Libraries directory:"
          if exist "Libraries" (
            dir /b Libraries
          ) else (
            echo ERROR: Libraries directory not found!
            exit /b 1
          )
          
          echo "Checking ThirdParty directory:"
          if exist "ThirdParty" (
            dir /b ThirdParty
          ) else (
            echo ERROR: ThirdParty directory not found!
            exit /b 1
          )

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          
          echo "Starting Telegram Desktop configuration..."
          
          call configure.bat x64 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          
          if errorlevel 1 (
            echo "Configuration failed with error level %errorlevel%"
            echo "Checking for common issues..."
            
            if not exist "..\out" (
              echo "Output directory was not created"
            ) else (
              echo "Output directory exists, listing contents:"
              dir ..\out
            )
            
            exit /b 1
          )
          
          echo "Configuration successful. Starting build..."
          cmake --build ..\out --config Release --parallel
          
          if errorlevel 1 (
            echo "Build failed with error level %errorlevel%"
            exit /b 1
          )
          
          echo "Build completed successfully."

      - name: Verify build output.
        if: env.ONLY_CACHE == 'false'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          echo "Checking build output in %OUT%"
          
          if exist "%OUT%\Telegram.exe" (
            echo "Telegram.exe found successfully"
            dir "%OUT%\Telegram.exe"
          ) else (
            echo "ERROR: Telegram.exe not found!"
            echo "Contents of output directory:"
            dir "%OUT%" 2>nul || echo "Output directory does not exist"
            exit /b 1
          )
          
          if exist "%OUT%\Updater.exe" (
            echo "Updater.exe found successfully"
            dir "%OUT%\Updater.exe"
          ) else (
            echo "WARNING: Updater.exe not found"
          )

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          echo "Preparing artifacts from %OUT%"
          
          mkdir artifact
          
          if exist "%OUT%\Telegram.exe" (
            echo "Moving Telegram.exe..."
            move "%OUT%\Telegram.exe" artifact\
          ) else (
            echo "ERROR: Telegram.exe not found for artifact creation"
            exit /b 1
          )
          
          if exist "%OUT%\Updater.exe" (
            echo "Moving Updater.exe..."
            move "%OUT%\Updater.exe" artifact\
          ) else (
            echo "WARNING: Updater.exe not found, skipping"
          )
          
          echo "Artifact contents:"
          dir artifact

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: Telegram_Release_x64
          path: artifact/
